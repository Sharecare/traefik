name: Build Binaries

on:
  push:
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]

env:
  CGO_ENABLED: 0
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  REPO: ghcr.io/sharecare/traefik
  VERSION: latest

permissions:
  contents: read

jobs:

  build-webui:
    uses: ./.github/workflows/template-webui.yaml

  build-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
    needs:
      - build-webui

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        env:
          ImageOS: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.goarm }}
        with:
          go-version-file: '.go-version'
          check-latest: true
          cache: false

      - name: Restore go modules cache
        uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Per-arch go build cache
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.goarm || 'na' }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.goarm || 'na' }}-

      - name: Artifact webui
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webui.tar.gz

      - name: Untar webui
        run: |
          tar xvf webui.tar.gz
          rm webui.tar.gz

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/*/}-AL" >> $GITHUB_ENV

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: make binary

      - name: Tar binary
        run: |
          tar czvf traefik-binary.tar.gz ./dist

      - name: Artifact binary
        uses: actions/upload-artifact@v7
        with:
          name: traefik-binary.tar.gz
          path: traefik-binary.tar.gz

  build-docker:
    runs-on: ubuntu-latest
    needs:
      - build-binary
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Artifact binary
        uses: actions/download-artifact@v8
        with:
          name: traefik-binary.tar.gz

      - name: Untar binary
        run: tar xvf traefik-binary.tar.gz

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        run: |
          docker build . --tag ${{ env.REPO }}:${{ env.VERSION }}
          docker push ${{ env.REPO }}:${{ env.VERSION }}
